name: 03 - Ejercicio 1 rojo a verde
on:
  workflow_dispatch:
    inputs:
      escenario:
        description: 'Seleccione una prueba: primero fallo y luego corregido'
        required: true
        type: choice
        default: fallo
        options:
          - fallo
          - corregido
permissions:
  contents: read
jobs:
  demostracion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar Gitleaks con SHA-256
        run: |
          python scripts/instalar_scanners.py
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Preparar archivo temporal sin imprimir credenciales
        env:
          ESCENARIO: ${{ inputs.escenario }}
        run: |
          python scripts/generar_caso_ejercicio.py --destino "$RUNNER_TEMP/maipo-ejercicio" --modo "$ESCENARIO"
      - name: Analizar el archivo temporal con Gitleaks
        run: gitleaks dir --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" "$RUNNER_TEMP/maipo-ejercicio"
      - name: Demostrar que el servicio sigue operativo tras corregir
        if: ${{ inputs.escenario == 'corregido' }}
        env:
          PLC_PASSWORD: ${{ secrets.PLC_PASSWORD }}
          PYTHONPATH: src
        run: python -m guardian_maipo --sensor SENS-001
