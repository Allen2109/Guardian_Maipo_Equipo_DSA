name: 01 - Integracion del simulador
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Leer repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolver dependencia verificada
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compilar archivos Python
        run: python -m compileall -q src scripts tests
      - name: Ejecutar doce pruebas unitarias
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Revisar cuatro sectores
        run: python scripts/revisar_sectores.py
      - name: Crear paquete del simulador
        run: python scripts/compilar.py
      - name: Publicar paquete como evidencia
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulador-maipo-${{ github.sha }}
          path: dist/guardian-maipo-lab.zip
          if-no-files-found: error
          retention-days: 14
